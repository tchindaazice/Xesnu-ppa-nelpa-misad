name: Mobile Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Prepare google-services.json
        working-directory: ./mobile
        run: |
          mkdir -p android/app
          if [ ! -f android/app/google-services.json ]; then
            echo '{"project_info": {"project_number": "123456789", "project_id": "dummy-project"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:abcdef", "android_client_info": {"package_name": "com.vpnplatform.mobile"}}, "api_key": [{"current_key": "dummy_key"}]}]}' > android/app/google-services.json
          fi

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Build AppBundle
        working-directory: ./mobile
        run: flutter build appbundle --release

      - name: Upload AppBundle
        uses: actions/upload-artifact@v3
        with:
          name: app-release.aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
